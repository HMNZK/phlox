<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>エラー文言 — カタログ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 2400px; height: 4700px; box-sizing: border-box; padding: 64px; overflow: hidden; background: {{c.page}}; color: {{c.text}}; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Hiragino Sans', 'Noto Sans JP', sans-serif; -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; gap: 44px">

<div style="display: flex; flex-direction: column; gap: 16px">
<div style="font-size: 15px; font-weight: 600; color: {{c.text2}}">エラー文言 · 4 章／8.4 節／15.2 節／16.1 節／16.5 節 · {{ themeLabel }}</div>
<h2 style="margin: 0; font-size: 34px; line-height: 1.25; font-weight: 700">どのエラーも「何が起きたか」→「なぜ・今どうなっているか」→「次にどうするか」の順に書く</h2>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
<sc-for list="{{ rules }}" as="r" hint-placeholder-count="4">
<div style="padding: 16px 18px; border-radius: 16px; background: {{c.card}}; border: 1px solid {{c.sep}}; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 13px; font-weight: 700; color: {{c.accentText}}">{{ r.k }}</div>
<div style="font-size: 16px; font-weight: 700">{{ r.t }}</div>
<div style="font-size: 14px; line-height: 1.55; color: {{c.text2}}">{{ r.d }}</div>
</div>
</sc-for>
</div>
</div>

<sc-for list="{{ sections }}" as="sec" hint-placeholder-count="4">
<section aria-label="{{ sec.title }}" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-direction: column; gap: 4px; padding-top: 14px; border-top: 2px solid {{c.rule}}">
<div style="font-size: 22px; font-weight: 700">{{ sec.title }}</div>
<div style="font-size: 15px; color: {{c.text2}}">{{ sec.desc }}</div>
</div>
<div style="display: grid; grid-template-columns: repeat({{sec.cols}}, minmax(0, 1fr)); gap: 20px; align-items: start">
<sc-for list="{{ sec.items }}" as="e" hint-placeholder-count="4">
<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; flex-wrap: wrap"><span style="font-family: ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: {{c.text3}}">{{ e.id }}</span><span style="font-size: 16px; font-weight: 700">{{ e.name }}</span><sc-for list="{{ e.chips }}" as="ch" hint-placeholder-count="1"><span style="padding: 2px 8px; border-radius: 999px; background: {{ch.bg}}; color: {{ch.fg}}; font-size: 11px; font-weight: 700">{{ ch.t }}</span></sc-for></div>
<div role="{{ e.role }}" style="padding: 18px; border-radius: 24px; background: {{c.card}}; box-shadow: 0 0 0 1px {{c.sep}}; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 12px; align-items: flex-start">
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
<div style="font-size: 17px; line-height: 1.35; font-weight: 700; color: {{e.headFg}}">{{ e.head }}</div>
<sc-if value="{{ e.hasBody }}" hint-placeholder-val="{{ true }}"><div style="font-size: 15px; line-height: 1.55">{{ e.body }}</div></sc-if>
<sc-if value="{{ e.hasNext }}" hint-placeholder-val="{{ true }}"><div style="font-size: 15px; line-height: 1.55; color: {{c.text2}}">{{ e.next }}</div></sc-if>
<sc-if value="{{ e.hasMono }}" hint-placeholder-val="{{ true }}"><div style="font-family: ui-monospace, 'SF Mono', Menlo, 'JetBrains Mono', monospace; font-size: 12px; line-height: 1.45; color: {{c.text2}}; overflow-wrap: anywhere">{{ e.mono }}</div></sc-if>
</div>
</div>
<sc-if value="{{ e.hasBtn }}" hint-placeholder-val="{{ true }}"><button type="button" aria-disabled="{{ e.btnDis }}" style="min-height: 48px; border: 0; border-radius: 999px; background: {{c.accent}}; color: {{c.accentOnFill}}; opacity: {{e.btnOp}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{ e.btn }}</button></sc-if>
<sc-if value="{{ e.hasBtn2 }}" hint-placeholder-val="{{ false }}"><button type="button" style="min-height: 44px; border: 0; background: transparent; color: {{c.accent}}; font: inherit; font-size: 16px; font-weight: 600; cursor: pointer">{{ e.btn2 }}</button></sc-if>
<sc-if value="{{ e.noBtn }}" hint-placeholder-val="{{ false }}"><div style="font-size: 13px; color: {{c.text3}}">ボタンは置かない（{{ e.noBtnWhy }}）</div></sc-if>
</div>
<div style="font-size: 13px; line-height: 1.5; color: {{c.text2}}">{{ e.note }}</div>
</div>
</sc-for>
</div>
</section>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":2400,"height":4700}}'>
