<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>ファイルツリーの操作</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<aside aria-label="インスペクタ: ファイル" style="{{ rootStyle }}">
  <div style="padding:10px 12px 8px;flex:none;">

      <button type="button" role="tab" aria-selected="false" title="Git（⇧⌃⌘G）" style="font:inherit;flex:1;height:22px;border:0;padding:0;border-radius:5px;font-size:12px;font-weight:500;color:#ABABB1;background:transparent;">Git</button>
    </div>
  </div>
  <div style="height:48px;box-sizing:border-box;flex:none;display:flex;align-items:center;gap:2px;padding:0 8px 8px 14px;border-bottom:1px solid rgba(242,242,244,0.10);">
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;">
      <span aria-label="ルート ~/Projects/Phlox-oss" style="font-size:11px;color:#ABABB1;font-family:ui-monospace,'SF Mono',Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:rtl;text-align:left;"><span style="direction:ltr;unicode-bidi:embed;">~/Projects/Phlox-oss</span></span>
      <span aria-label="ブランチ feature/bottom-panel" style="height:16px;display:flex;align-items:center;gap:5px;font-size:11px;min-width:0;"><svg aria-hidden="true" width="10" height="11" viewBox="0 0 14 14" fill="none" stroke="#ABABB1" stroke-width="1.4" style="flex:none;"><circle cx="4" cy="3" r="1.6"></circle><circle cx="4" cy="11" r="1.6"></circle><circle cx="10.5" cy="4.5" r="1.6"></circle><line x1="4" y1="4.6" x2="4" y2="9.4"></line><path d="M10.5 6.1 C10.5 8.5 4 7.5 4 9.4"></path></svg><span style="color:#F2F2F4;font-family:ui-monospace,'SF Mono',Menlo,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">feature/bottom-panel</span></span>
    </div>
    <div style="position:relative;flex:none;">
      <button type="button" aria-label="新規ファイル・フォルダ" aria-haspopup="menu" title="新規ファイル・フォルダ" style="{{ plusBtn }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg></button>
      <sc-if value="{{ plusMenu }}" hint-placeholder-val="{{ false }}">
        <div role="menu" aria-label="新規" style="position:absolute;top:26px;right:-30px;width:200px;box-sizing:border-box;background:rgba(43,43,45,0.96);border-radius:8px;box-shadow:0 0 0 0.5px rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.5);padding:5px;display:flex;flex-direction:column;font-size:13px;z-index:10;">
          <sc-for list="{{ plusMenu }}" as="m" hint-placeholder-count="3">
            <sc-if value="{{ m.isItem }}"><div role="menuitem" aria-disabled="{{ m.dis }}" style="{{ m.s }}"><span style="flex:1;">{{ m.t }}</span><span style="{{ m.ks }}">{{ m.k }}</span></div></sc-if>
            <sc-if value="{{ m.isSep }}"><div style="height:1px;background:rgba(242,242,244,0.10);margin:4px 6px;"></div></sc-if>
            <sc-if value="{{ m.isFoot }}"><div style="{{ m.fs }}">{{ m.t }}</div></sc-if>
          </sc-for>
        </div>
      </sc-if>
    </div>
    <button type="button" aria-label="更新" title="更新" style="width:24px;height:22px;border:0;padding:0;border-radius:5px;display:flex;align-items:center;justify-content:center;color:#ABABB1;background:transparent;flex:none;"><svg aria-hidden="true" width="13" height="13" viewBox="0 0 13 13" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M11 4.2 A4.8 4.8 0 1 0 11.4 7.5"></path><polyline points="11.2,1.5 11.2,4.4 8.3,4.4"></polyline></svg></button>
  </div>

  <sc-if value="{{ banner }}" hint-placeholder-val="{{ false }}">
    <div role="alert" style="margin:8px 8px 0;padding:7px 4px 7px 10px;border-radius:8px;background:#27272A;box-shadow:inset 0 0 0 1px rgba(242,242,244,0.14);display:flex;align-items:flex-start;gap:8px;flex:none;">
      <span aria-hidden="true" style="width:14px;height:14px;flex:none;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.4px #EE5A5F;font-size:10px;font-weight:800;color:#FF8A8D;display:flex;align-items:center;justify-content:center;">!</span>
      <span style="flex:1;min-width:0;font-size:12px;line-height:1.5;color:#F2F2F4;text-wrap:pretty;">{{ banner }}</span>
      <button type="button" aria-label="閉じる" title="閉じる" style="width:20px;height:20px;border:0;padding:0;border-radius:5px;background:transparent;color:#ABABB1;display:flex;align-items:center;justify-content:center;flex:none;"><svg aria-hidden="true" width="8" height="8" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></button>
    </div>
  </sc-if>

  <div role="tree" aria-label="ファイル" style="{{ treeStyle }}">
    <sc-for list="{{ rows }}" as="r" hint-placeholder-count="24">
      <div role="treeitem" aria-label="{{ r.aria }}" aria-selected="{{ r.selected }}" style="{{ r.s }}">
        <span aria-hidden="true" style="{{ r.chev }}">›</span>
        <span aria-hidden="true" style="{{ r.iconWrap }}">
          <sc-if value="{{ r.folder }}"><svg width="15" height="12" viewBox="0 0 16 13" fill="none" stroke="#ABABB1" stroke-width="1.2"><path d="M1 2.4 V11.2 Q1 12 1.8 12 H14.2 Q15 12 15 11.2 V4.3 Q15 3.5 14.2 3.5 H7.4 L6 1.6 H1.8 Q1 1.6 1 2.4 Z"></path></svg></sc-if>
          <sc-if value="{{ r.file }}"><span style="width:10px;height:12px;border-radius:2px;box-shadow:inset 0 0 0 1.2px #ABABB1;"></span></sc-if>
          <sc-if value="{{ r.link }}"><span style="position:absolute;right:-3px;bottom:-3px;width:9px;height:9px;border-radius:2px;background:#3A3A3E;color:#F2F2F4;font-size:8px;line-height:9px;text-align:center;font-weight:700;">↗</span></sc-if>
        </span>
        <sc-if value="{{ r.isName }}">
          <span style="{{ r.ns }}">{{ r.name }}</span>
          <sc-if value="{{ r.meta }}"><span style="{{ r.metaStyle }}">{{ r.meta }}</span></sc-if>
        </sc-if>
        <sc-if value="{{ r.isField }}">
          <div role="textbox" aria-label="{{ r.fieldAria }}" aria-invalid="{{ r.invalid }}" style="{{ r.fieldStyle }}"><span style="{{ r.selPart }}">{{ r.fieldSel }}</span><span style="white-space:pre;">{{ r.fieldRest }}</span><sc-if value="{{ r.caret }}"><span aria-hidden="true" style="width:1.5px;height:15px;background:#F2F2F4;margin-left:1px;flex:none;"></span></sc-if><sc-if value="{{ r.placeholder }}"><span style="color:#8E8E94;margin-left:2px;">{{ r.placeholder }}</span></sc-if></div>
        </sc-if>
        <sc-if value="{{ r.callout }}">
          <div role="alert" style="{{ r.calloutStyle }}">
            <span aria-hidden="true" style="width:14px;height:14px;flex:none;margin-top:1px;border-radius:50%;box-shadow:inset 0 0 0 1.4px #EE5A5F;font-size:10px;font-weight:800;color:#FF8A8D;display:flex;align-items:center;justify-content:center;">!</span>
            <span style="flex:1;min-width:0;font-size:12px;line-height:1.5;color:#F2F2F4;text-wrap:pretty;">{{ r.callout }}</span>
          </div>
        </sc-if>
        <sc-if value="{{ r.menu }}">
          <div role="menu" aria-label="{{ r.name }}" style="{{ r.menuStyle }}">
            <sc-for list="{{ r.menu }}" as="m" hint-placeholder-count="8">
              <sc-if value="{{ m.isItem }}"><div role="menuitem" aria-disabled="{{ m.dis }}" style="{{ m.s }}"><span style="flex:1;">{{ m.t }}</span><span style="{{ m.ks }}">{{ m.k }}</span></div></sc-if>
              <sc-if value="{{ m.isSep }}"><div style="height:1px;background:rgba(242,242,244,0.10);margin:4px 6px;"></div></sc-if>
              <sc-if value="{{ m.isFoot }}"><div style="{{ m.fs }}">{{ m.t }}</div></sc-if>
            </sc-for>
          </div>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{ treeMenu }}" hint-placeholder-val="{{ false }}">
      <div role="menu" aria-label="Phlox-oss" style="position:absolute;left:36px;top:300px;width:212px;box-sizing:border-box;background:rgba(43,43,45,0.96);border-radius:8px;box-shadow:0 0 0 0.5px rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.5);padding:5px;display:flex;flex-direction:column;font-size:13px;z-index:10;">
        <sc-for list="{{ treeMenu }}" as="m" hint-placeholder-count="8">
          <sc-if value="{{ m.isItem }}"><div role="menuitem" aria-disabled="{{ m.dis }}" style="{{ m.s }}"><span style="flex:1;">{{ m.t }}</span><span style="{{ m.ks }}">{{ m.k }}</span></div></sc-if>
          <sc-if value="{{ m.isSep }}"><div style="height:1px;background:rgba(242,242,244,0.10);margin:4px 6px;"></div></sc-if>
          <sc-if value="{{ m.isFoot }}"><div style="{{ m.fs }}">{{ m.t }}</div></sc-if>
        </sc-for>
      </div>
    </sc-if>
  </div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":280,"height":900},"variant":{"editor":"enum","options":["normal","plusMenu","ctxFile","ctxFolder","ctxBlank","ctxOutside","newFile","newFolder","errSame","errSameFolder","errSlash","errEmpty","rename","created","renamed","fail"],"default":"normal"},"width":{"editor":"int","default":280},"height":{"editor":"int","default":900}}'>
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const v = p.variant || 'normal';
    const W = Number(p.width) || 280, H = Number(p.height) || 900;
    const IND = 14;
    const KIND = { d:'フォルダ', o:'フォルダ', f:'ファイル', ls:'ファイルへのリンク', ld:'フォルダへのリンク', lx:'作業ツリーの外を指すリンク', input:'' };

    const menu = (list) => {
      let hiDone = false;
      return list.map((x) => {
        if (x === '-') return { isSep:true };
        if (x.head) return { isFoot:true, t:x.head, fs:{ padding:'3px 10px 3px', fontSize:11, fontWeight:600, lineHeight:1.4, color:'rgba(255,255,255,0.5)', whiteSpace:'normal', textWrap:'pretty' } };
        const dis = !!x.dis;
        const hi = !dis && !hiDone && x.hi;
        if (hi) hiDone = true;
        return { isItem:true, t:x.t, k:x.k || ({ '新規ファイル':'⌥⌘N', '新規フォルダ':'⇧⌥⌘N' }[x.t] || ''), dis,
          s:{ display:'flex', alignItems:'center', gap:16, height:22, padding:'0 10px', borderRadius:4, whiteSpace:'nowrap', fontSize:13, color: hi ? '#FFFFFF' : dis ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.85)', background: hi ? '#0A64D8' : 'transparent' },
          ks:{ fontSize:13, color: hi ? 'rgba(255,255,255,0.85)' : dis ? 'rgba(255,255,255,0.25)' : 'rgba(255,255,255,0.5)' } };
      });
    };
    const ren = { t:'名前を変更' }, tr = { t:'ゴミ箱に入れる', k:'⌘⌫' };
    const M = {
      file: [{ t:'右に分割して開く', hi:true }, '-', { t:'新規ファイル' }, { t:'新規フォルダ' }, '-', ren, tr, '-', { t:'Finder で表示' }, { t:'パスをコピー' }],
      folder: [{ t:'新規ファイル', hi:true }, { t:'新規フォルダ' }, '-', ren, tr, '-', { t:'Finder で表示' }, { t:'パスをコピー' }],
      root: [{ head:'Phlox-oss（ルート）' }, { t:'新規ファイル', hi:true }, { t:'新規フォルダ' }, '-', { ...ren, dis:true }, { ...tr, dis:true }, '-', { t:'Finder で表示' }, { t:'パスをコピー' }],
      outside: [{ head:'ルートの外を指すリンク' }, { t:'新規ファイル', dis:true }, { t:'新規フォルダ', dis:true }, '-', { ...ren, dis:true }, { ...tr, dis:true }, '-', { t:'Finder で表示', hi:true }, { t:'パスをコピー' }],
      plus: [{ head:'Phlox-oss の直下に作成' }, { t:'新規ファイル', hi:true }, { t:'新規フォルダ' }]
    };

    const row = (o) => {
      const { name, depth, k, meta, st } = o;
      const st0 = st || '';
      const strong = st0 === 'cursor';
      const isField = k === 'input';
      const folder = ['d','o','ld','lx'].includes(k) || o.fk === 'd';
      const outside = k === 'lx';
      const bg = { sel:'rgba(242,242,244,0.09)', cursor:'rgba(242,242,244,0.24)', hover:'rgba(242,242,244,0.05)', open:'rgba(242,242,244,0.05)' }[st0] || 'transparent';
      const r = {
        isName: !isField, isField, name: name || '', meta: meta || '', selected: st0 === 'sel' || strong,
        folder, file: !folder && ['f','ls','input'].includes(k), link: ['ls','ld','lx'].includes(k),

        chev:{ width:12, flex:'none', textAlign:'center', fontSize:13, color:'#8E8E94', transform: k==='o' ? 'rotate(90deg)' : 'none', visibility: (k==='d'||k==='o') ? 'visible' : 'hidden' },
        iconWrap:{ width:15, height:14, flex:'none', position:'relative', display:'flex', alignItems:'center', justifyContent:'center', opacity: outside ? 0.5 : 1 },
        ns:{ flex:1, minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', color: outside && !strong ? '#ABABB1' : '#F2F2F4', fontWeight: o.bold ? 600 : 400 },
        metaStyle:{ fontSize:11, color: strong ? '#F2F2F4' : '#ABABB1', flex:'none', whiteSpace:'nowrap' },
        s:{ position:'relative', display:'flex', alignItems:'center', gap:5, height:28, flex:'none', boxSizing:'border-box', padding:`0 6px 0 ${4+depth*IND}px`, borderRadius:6, fontSize:13, background:bg, boxShadow: st0 === 'ctx' ? 'inset 0 0 0 2px #F2F2F4' : 'none' },
        callout: o.callout || '', menu: o.menu ? menu(o.menu) : null
      };
      if (isField) {
        const empty = !o.fieldSel && !o.fieldRest;
        r.fieldSel = o.fieldSel || ''; r.fieldRest = o.fieldRest || ''; r.caret = !!o.caret; r.placeholder = empty ? (o.ph || '名前') : '';
        r.invalid = !!o.callout;
        r.fieldAria = o.fieldAria;
        r.fieldStyle = { flex:1, minWidth:0, height:22, boxSizing:'border-box', borderRadius:5, background:'#1A1A1C', boxShadow:'0 0 0 1px rgba(242,242,244,0.14), 0 0 0 3px #F2F2F4', padding:'0 6px', display:'flex', alignItems:'center', fontSize:13, color:'#F2F2F4', marginRight:3, overflow:'hidden', whiteSpace:'nowrap' };
        r.selPart = { background: o.fieldSel ? 'rgba(242,242,244,0.24)' : 'transparent', borderRadius:2, whiteSpace:'pre' };
        r.calloutStyle = { position:'absolute', top:30, left: 4 + depth*IND + 22, right:0, zIndex:10, padding:'7px 9px', borderRadius:8, background:'#2F2F33', boxShadow:'0 12px 34px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.16)', display:'flex', alignItems:'flex-start', gap:7 };
      }
      if (r.menu) r.menuStyle = { position:'absolute', left: Math.min(o.menuLeft ?? 60, W - 16 - 212 - 4), top:26, width:212, boxSizing:'border-box', background:'rgba(43,43,45,0.96)', borderRadius:8, boxShadow:'0 0 0 0.5px rgba(255,255,255,0.18), 0 10px 30px rgba(0,0,0,0.5)', padding:5, display:'flex', flexDirection:'column', fontSize:13, zIndex:10 };
      return r;
    };
    const R = (name, depth, k, meta, st, x) => ({ name, depth, k, meta, st, ...(x || {}) });
    const input = (depth, x) => R('', depth, 'input', null, null, { caret:true, ...x });

    const tree = (o) => {
      const guidesKids = o.guidesKids || [R('file-tree.md',2,'f',null,o.ft || 'sel',{ isOpen:true, bold: o.ftBold !== false }), R('step-1-setup.md',2,'f'), R('step-2-tree.md',2,'f'), R('step-10-release.md',2,'f')];
      const filesKids = o.filesKids || [R('FileTreeLoader.swift',5,'f'), R('FileTreeModel.swift',5,'f',null,o.ftm,o.ftmx), R('FileTreeView.swift',5,'f',null,o.ftv,o.ftvx)];
      return [
        ...(o.git ? [R('.git',0,'o'), R('hooks',1,'d'), R('refs',1,'d'), R('config',1,'f',null,o.gitCfg,o.gitCfgx), R('HEAD',1,'f'), R('index',1,'f')] : []),
        R('.github',0,'d'),
        ...(o.docsClosed ? [R('docs',0,'d',null,o.docsSt)] : [
          R('docs',0,'o',null,o.docsSt,o.docsx),
          ...(o.docsTop || []),
          R('adr',1,'d'),
          ...(o.guidesClosed ? [R('guides',1,'d',null,o.guidesSt,o.guidesx)] : [R('guides',1,'o',null,o.guidesSt,o.guidesx), ...guidesKids]),
          R('latest',1,'ld','→ guides'), R('shared-assets',1,'lx','ルート外',o.lx,o.lxx)
        ]),
        ...(o.macosClosed ? [R('macos',0,'d')] : [
          R('macos',0,'o'), R('App',1,'d'), R('Packages',1,'o'), R('DashboardFeature',2,'o'), R('Sources',3,'o'), R('Files',4,'o'),
          ...filesKids,
          R('Tests',3,'d'), R('Package.swift',3,'f'), R('DesignSystem',2,'d'), R('project.yml',1,'f')
        ]),
        R('scripts',0,'d'), R('.gitignore',0,'f'), R('AGENTS.md',0,'f'), R('CLAUDE.md',0,'ls','→ AGENTS.md'), R('LICENSE',0,'f'), R('README.md',0,'f')
      ];
    };

    let src = tree({}), treeFocus = false, treeCtx = false, treeMenu = null, plusOpen = false, banner = '';
    const guidesWithInput = (x) => [input(2, x), R('file-tree.md',2,'f',null,'sel',{ isOpen:true, bold:true }), R('step-1-setup.md',2,'f'), R('step-2-tree.md',2,'f'), R('step-10-release.md',2,'f')];
    switch (v) {
      case 'plusMenu': plusOpen = true; break;
      case 'ctxFile': src = tree({ ftv:'ctx', ftvx:{ menu:M.file, menuLeft:60 } }); break;
      case 'ctxFolder': src = tree({ guidesSt:'ctx', guidesx:{ menu:M.folder, menuLeft:60 }, macosClosed:true }); break;
      case 'ctxBlank': src = tree({ macosClosed:true, docsClosed:true }); treeCtx = true; treeMenu = menu(M.root); break;

      case 'newFile': src = tree({ guidesKids: guidesWithInput({ ph:'ファイル名', fieldAria:'新規ファイルの名前、guides の中、テキストフィールド' }), macosClosed:true }); break;

      case 'errSlash': src = tree({ guidesKids: guidesWithInput({ fieldRest:'notes/today.md', callout:'名前に / は使えません', fieldAria:'新規ファイルの名前、notes/today.md、使えない名前' }), macosClosed:true }); break;
      case 'errEmpty': src = tree({ guidesKids: guidesWithInput({ callout:'名前を入力してください', ph:'ファイル名', fieldAria:'新規ファイルの名前、空、使えない名前' }), macosClosed:true }); break;

      case 'created': src = tree({ macosClosed:true, guidesKids:[R('file-tree.md',2,'f',null,null,{ isOpen:true }), R('notes.md',2,'f',null,'cursor',{ isOpen:true, bold:true }), R('step-1-setup.md',2,'f'), R('step-2-tree.md',2,'f'), R('step-10-release.md',2,'f')] }); treeFocus = true; break;
      case 'renamed': src = tree({ ft:'open', filesKids:[R('FileTreeLoader.swift',5,'f'), R('FileTreeState.swift',5,'f',null,'cursor'), R('FileTreeView.swift',5,'f')] }); treeFocus = true; break;

      default: break;
    }
    const rows = src.map(row);
    return {
      rows, treeMenu, banner,
      plusMenu: plusOpen ? menu(M.plus) : null,
      plusBtn:{ width:24, height:22, border:0, padding:0, borderRadius:5, display:'flex', alignItems:'center', justifyContent:'center', color: plusOpen ? '#F2F2F4' : '#ABABB1', background: plusOpen ? 'rgba(242,242,244,0.12)' : 'transparent' },

    };
  }
}
