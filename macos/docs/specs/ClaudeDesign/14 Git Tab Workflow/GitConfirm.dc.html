<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Git の操作の確認</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="position:relative;width:440px;height:600px;box-sizing:border-box;border-radius:12px;background:#1E1E20;padding:60px 18px 28px;display:flex;justify-content:center;align-items:flex-start;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Hiragino Sans','Hiragino Kaku Gothic ProN',sans-serif;-webkit-font-smoothing:antialiased;color:#F2F2F4;box-shadow:0 0 0 0.5px rgba(0,0,0,0.25), 0 10px 30px rgba(0,0,0,0.18);">
  <div style="position:absolute;left:0;right:0;top:0;height:52px;background:#2A2A2D;border-bottom:1px solid rgba(242,242,244,0.10);display:flex;align-items:center;gap:8px;padding:0 14px;">
    <span style="width:12px;height:12px;border-radius:50%;background:#FF5F57;"></span><span style="width:12px;height:12px;border-radius:50%;background:#FEBC2E;"></span><span style="width:12px;height:12px;border-radius:50%;background:#28C840;"></span>
    <span style="font-size:12px;font-weight:600;color:#ABABB1;margin-left:10px;">Phlox-oss</span>
  </div>
  <div style="position:absolute;left:0;right:0;top:52px;bottom:0;background:rgba(0,0,0,0.32);"></div>
  <div role="alertdialog" aria-label="{{ title }}" aria-describedby="gc-body" style="position:relative;width:320px;box-sizing:border-box;background:#2F2F33;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.14);padding:20px 16px 16px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;">
    <div aria-hidden="true" style="width:56px;height:56px;border-radius:13px;flex:none;background:linear-gradient(140deg,#7A5CF5 0%,#B45CE6 50%,#EC6AA8 100%);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 0.5px rgba(255,255,255,0.28),0 1px 3px rgba(0,0,0,0.35);"><svg width="40" height="40" viewBox="0 0 24 24"><path d="M7 8.5L16.5 7M7 8.5l5 8.5M16.5 7L12 17" stroke="#fff" stroke-opacity="0.8" stroke-width="1.6" fill="none"></path><circle cx="7" cy="8.5" r="2.4" fill="#fff"></circle><circle cx="16.5" cy="7" r="2.4" fill="#fff"></circle><circle cx="12" cy="17" r="2.4" fill="#fff"></circle></svg></div>
    <div style="font-size:13px;font-weight:700;line-height:1.45;text-wrap:balance;overflow-wrap:anywhere;">{{ title }}</div>
    <div id="gc-body" style="font-size:11.5px;line-height:1.6;text-wrap:pretty;">{{ body }}</div>
    <div role="list" aria-label="{{ listAria }}" style="width:100%;box-sizing:border-box;text-align:left;background:#1E1E20;border-radius:6px;box-shadow:0 0 0 0.5px rgba(255,255,255,0.10);display:flex;flex-direction:column;padding:3px 0;">
      <sc-for list="{{ items }}" as="r" hint-placeholder-count="1">
        <div role="listitem" aria-label="{{ r.aria }}" style="{{ r.s }}">
          <sc-if value="{{ r.isBranch }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 14 14" fill="none" style="flex:none;stroke:#ABABB1;stroke-width:1.4;"><circle cx="4" cy="3" r="1.6"></circle><circle cx="4" cy="11" r="1.6"></circle><circle cx="10.5" cy="4.5" r="1.6"></circle><line x1="4" y1="4.6" x2="4" y2="9.4"></line><path d="M10.5 6.1 C10.5 8.5 4 7.5 4 9.4"></path></svg></sc-if>
          <sc-if value="{{ r.isStash }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" style="flex:none;stroke:#ABABB1;stroke-width:1.3;stroke-linejoin:round;"><path d="M2.5 6.5h11v6.5h-11zM3.5 3.5h9M2.5 6.5l1-3M13.5 6.5l-1-3M6 9.5h4"></path></svg></sc-if>
          <sc-if value="{{ r.isSession }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 16 16" fill="none" style="flex:none;stroke:#ABABB1;stroke-width:1.3;stroke-linejoin:round;"><path d="M2.5 3.5h11v7.5H7l-3 2.5V11H2.5z"></path></svg></sc-if>
          <sc-if value="{{ r.isChanges }}"><span aria-hidden="true" style="width:12px;height:12px;flex:none;display:flex;align-items:center;justify-content:center;"><span style="width:9px;height:11px;border-radius:2px;box-shadow:inset 0 0 0 1.1px #ABABB1;"></span></span></sc-if>
          <span style="flex:1;min-width:0;display:flex;flex-direction:column;">
            <span style="{{ r.ts }}">{{ r.t }}</span>
            <span style="font-size:10.5px;color:#ABABB1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ r.m }}</span>
          </span>
          <sc-if value="{{ r.tag }}"><span style="font-size:10.5px;color:#F2F2F4;border-radius:4px;padding:1px 5px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.22);flex:none;white-space:nowrap;">{{ r.tag }}</span></sc-if>
        </div>
      </sc-for>
    </div>
    <sc-if value="{{ warn }}">
      <div style="width:100%;box-sizing:border-box;display:flex;gap:8px;align-items:flex-start;text-align:left;padding:8px 10px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.14);">
        <span aria-hidden="true" style="width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.3px #F2F2F4;font-size:9px;font-weight:800;color:#F2F2F4;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px;">!</span>
        <span style="font-size:11px;line-height:1.55;text-wrap:pretty;"><b>{{ warn.t }}</b> {{ warn.b }}</span>
      </div>
    </sc-if>
    <sc-if value="{{ note }}"><div style="font-size:11px;line-height:1.55;color:#ABABB1;text-wrap:pretty;">{{ note }}</div></sc-if>
    <div style="display:flex;gap:8px;width:100%;margin-top:4px;flex-direction:column;">
      <button type="button" style="height:28px;border:0;border-radius:6px;display:flex;align-items:center;justify-content:center;font:inherit;font-size:13px;font-weight:600;color:#1E1E20;background:#F2F2F4;">{{ primary }}<span style="font-size:11px;font-weight:400;margin-left:6px;">↩</span></button>
      <button type="button" style="{{ secondStyle }}">{{ secondary }}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":440,"height":600},"variant":{"editor":"enum","options":["deleteMerged","deleteUnmerged","deleteStash","switchRunning","stashRunning","popRunning","checkoutRunning","switchRunningKb"],"default":"deleteMerged"}}'>
class Component extends DCLogic {
  renderVals() {
    const v = this.props.variant || 'deleteMerged';
    const row = (kind, t, m, tag, mono) => ({ t, m, tag: tag || '', isBranch: kind === 'branch', isStash: kind === 'stash', isSession: kind === 'session', isChanges: kind === 'changes',
      aria: `${t}、${m}${tag ? '、' + tag : ''}`,
      ts:{ fontSize:11.5, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontFamily: mono ? "ui-monospace,'SF Mono',Menlo,monospace" : 'inherit' },
      s:{ display:'flex', alignItems:'center', gap:8, minHeight:34, padding:'3px 10px', boxSizing:'border-box' } });
    const SESSION = row('session', 'Git タブを作業の集約に作り直す', 'Claude Code · Phlox-oss のフォルダ', '実行中');
    const RUN = { t:'このフォルダで動いているセッションがあります。', b:'ファイルが書き換わります。' };
    const C = {
      deleteMerged:{ title:'ブランチ fix/file-tree-focus-ring を削除しますか？', body:'main にマージ済みです。コミットは main に残ります。この操作は取り消せません。',
        items:[row('branch','fix/file-tree-focus-ring','main にマージ済み · 最後のコミット 3 日前','',true)], warn:null, note:'', primary:'削除', secondary:'キャンセル', danger:false, listAria:'削除するブランチ' },
      deleteUnmerged:{ title:'feature/worktree-start はマージされていません。削除しますか？', body:'どのブランチにも入っていないコミットが 3 件あります。削除すると、これらのコミットはブランチからたどれなくなります。',
        items:[row('branch','feature/worktree-start','最後のコミット 5 日前 · origin になし','未マージ 3 件',true)], warn:null, note:'削除するには強制削除（git branch -D）が要ります。残したいコミットは、先にプッシュするか別のブランチを作ってください。', primary:'キャンセル', secondary:'強制削除', danger:true, listAria:'削除するブランチ' },
      deleteStash:{ title:'stash@{0} を削除しますか？', body:'スタッシュの中の変更は戻せません。',
        items:[row('stash','WIP: 差分の行番号を 300pt 以上で出す','stash@{0} · 昨日 · ファイル 2')], warn:null, note:'', primary:'キャンセル', secondary:'削除', danger:true, listAria:'削除するスタッシュ' },
      switchRunning:{ title:'main に切り替えますか？', body:'作業ツリーのファイルが main の内容に替わります。',
        items:[SESSION], warn:RUN, note:'ワークツリーで動いているセッションは対象外です。', primary:'キャンセル', secondary:'切り替える', danger:false, listAria:'このフォルダで動いているセッション' },
      stashRunning:{ title:'今の変更をスタッシュしますか？', body:'変更 9 件（未追跡 2 件を含む）をしまい、作業ツリーを HEAD に戻します。',
        items:[row('changes','変更 9 件','ステージ済み 3 · 変更 6 · メッセージなし'), SESSION], warn:RUN, note:'', primary:'キャンセル', secondary:'スタッシュ', danger:false, listAria:'しまう変更と、このフォルダで動いているセッション' },
      popRunning:{ title:'stash@{0} を取り出しますか？', body:'変更を作業ツリーに戻し、stash@{0} を削除します。衝突したときはスタッシュを残します。',
        items:[row('stash','WIP: 差分の行番号を 300pt 以上で出す','stash@{0} · 昨日 · ファイル 2'), SESSION], warn:RUN, note:'', primary:'キャンセル', secondary:'取り出す', danger:false, listAria:'取り出すスタッシュと、このフォルダで動いているセッション' },
      checkoutRunning:{ title:'origin/feature/bottom-panel をチェックアウトしますか？', body:'追跡付きのローカルブランチ feature/bottom-panel を作って切り替えます。',
        items:[row('branch','feature/bottom-panel','origin/feature/bottom-panel を追跡','新規',true), SESSION], warn:RUN, note:'', primary:'キャンセル', secondary:'チェックアウト', danger:false, listAria:'作るブランチと、このフォルダで動いているセッション' }
    };
    C.switchRunningKb = { ...C.switchRunning, focus2:true };
    const c = C[v] || C.deleteMerged;
    c.items.forEach((r, i) => { if (i > 0) r.s = { ...r.s, borderTop:'1px solid rgba(255,255,255,0.08)' }; });
    return {
      title:c.title, body:c.body, items:c.items, warn:c.warn, note:c.note, primary:c.primary, secondary:c.secondary, listAria:c.listAria,
      secondStyle:{ height:28, border:0, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center', font:'inherit', fontSize:13, fontWeight: c.danger ? 600 : 400, color: c.danger ? '#FF8A8D' : '#F2F2F4', background:'#3A3A3E', boxShadow: c.focus2 ? '0 0 0 2px #2F2F33, 0 0 0 4px #F2F2F4' : '0 0 0 0.5px rgba(255,255,255,0.12), 0 0.5px 1px rgba(0,0,0,0.1)' }
    };
  }
}
</script>
</body>
</html>
