<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ rootStyle }}">
  <div style="position:relative;width:760px;">
    <sc-if value="{{ menuAbove }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;left:0;bottom:calc(100% + 8px);z-index:5;">
        <dc-import name="PhloxMenu" items="{{ menu.items }}" width="760" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="760px,220px"></dc-import>
      </div>
    </sc-if>
    <div style="{{ composerStyle }}">
      <sc-if value="{{ image }}" hint-placeholder-val="{{ false }}">
        <div style="display:flex;gap:8px;margin-bottom:10px;">
          <div style="position:relative;width:52px;height:52px;border-radius:6px;background:repeating-linear-gradient(135deg,var(--sel) 0 4px,transparent 4px 8px);box-shadow:inset 0 0 0 1px var(--fieldBorder);display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px;box-sizing:border-box;">
            <span style="font-family:ui-monospace,'SF Mono',Menlo,monospace;font-size:8.5px;color:var(--fg3);">screenshot</span>
            <div title="添付を外す" style="position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:8px;background:var(--ctl);box-shadow:0 0 0 1px var(--ctlBorder);display:flex;align-items:center;justify-content:center;color:var(--fg2);"><svg width="8" height="8" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"></path></svg></div>
          </div>
        </div>
      </sc-if>
      <div style="min-height:40px;font-size:13px;line-height:20px;">
        <sc-if value="{{ hasText }}" hint-placeholder-val="{{ false }}">
          <div style="display:flex;align-items:center;flex-wrap:wrap;color:var(--fg);"><span style="white-space:pre-wrap;">{{ textMain }}</span><sc-if value="{{ hasToken }}" hint-placeholder-val="{{ false }}"><span style="color:var(--fg);font-weight:600;">{{ token }}</span></sc-if><sc-if value="{{ caret }}" hint-placeholder-val="{{ false }}"><span style="width:1.5px;height:16px;background:var(--fg);"></span></sc-if></div>
        </sc-if>
        <sc-if value="{{ empty }}" hint-placeholder-val="{{ true }}">
          <div style="color:var(--fg3);">やりたいことを入力（/ でコマンド）</div>
        </sc-if>
      </div>
      <sc-if value="{{ hasReason }}" hint-placeholder-val="{{ false }}">
        <div style="margin-top:8px;font-size:12px;line-height:1.5;color:var(--fg);">{{ reason }}</div>
      </sc-if>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
        <div style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;">
          <div style="position:relative;">
            <div title="添付" style="{{ chip.attach }}"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg></div>
            <sc-if value="{{ open.attach }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;top:32px;z-index:5;"><dc-import name="PhloxMenu" items="{{ menu.items }}" width="{{ menu.width }}" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="200px,80px"></dc-import></div>
            </sc-if>
          </div>
          <div style="position:relative;">
            <div title="{{ harnessTitle }}" style="{{ chip.harness }}">
              <span style="display:flex;color:var(--fg);"><dc-import name="HarnessLogo" harness="{{ harnessKey }}" size="14" hint-size="14px,14px"></dc-import></span><span style="color:var(--fg);">{{ modelName }}</span>
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg>
            </div>
            <sc-if value="{{ tooltip }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;top:32px;z-index:5;width:max-content;padding:4px 8px;border-radius:6px;background:var(--popover);box-shadow:var(--shadow);font-size:11px;color:var(--fg);">{{ harnessTitle }}</div>
            </sc-if>
            <sc-if value="{{ open.harness }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;top:32px;z-index:5;"><dc-import name="PhloxHarnessMenu" variant="{{ hmVariant }}" hint-size="320px,420px"></dc-import></div>
            </sc-if>
          </div>
          <div style="position:relative;">
            <div style="{{ chip.effort }}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.4" stroke-linecap="round"><path d="{{ effortIcon }}"></path></svg>{{ effortLabel }}
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg>
            </div>
            <sc-if value="{{ open.effort }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;left:0;top:32px;z-index:5;"><dc-import name="PhloxMenu" items="{{ menu.items }}" width="{{ menu.width }}" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="180px,200px"></dc-import></div>
            </sc-if>
          </div>
          <sc-if value="{{ hasPerm }}" hint-placeholder-val="{{ true }}">
            <div style="position:relative;">
              <div style="{{ chip.perm }}">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linejoin="round"><path d="M8 2l5 2v4c0 3-2.2 5.2-5 6-2.8-.8-5-3-5-6V4z"></path></svg>{{ permLabel }}
                <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg>
              </div>
              <sc-if value="{{ open.perm }}" hint-placeholder-val="{{ false }}">
                <div style="position:absolute;left:0;top:32px;z-index:5;"><dc-import name="PhloxMenu" items="{{ menu.items }}" width="{{ menu.width }}" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="220px,220px"></dc-import></div>
              </sc-if>
            </div>
          </sc-if>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:2px;">
          <div style="position:relative;">
            <div style="{{ chip.project }}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linejoin="round"><path d="M2 4.5A1 1 0 013 3.5h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"></path></svg>{{ projectLabel }}
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg>
            </div>
            <sc-if value="{{ open.project }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;right:0;top:32px;z-index:5;"><dc-import name="PhloxMenu" items="{{ menu.items }}" width="{{ menu.width }}" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="320px,220px"></dc-import></div>
            </sc-if>
          </div>
          <div style="position:relative;">
            <div style="{{ chip.workspace }}">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ workspaceIcon }}"></path></svg>{{ workspaceLabel }}
              <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg>
            </div>
            <sc-if value="{{ open.workspace }}" hint-placeholder-val="{{ false }}">
              <div style="position:absolute;right:0;top:32px;z-index:5;"><dc-import name="PhloxMenu" items="{{ menu.items }}" width="{{ menu.width }}" header="{{ menu.header }}" footer="{{ menu.footer }}" hint-size="320px,160px"></dc-import></div>
            </sc-if>
          </div>
          <div style="width:6px;"></div>
          <div title="送信" style="{{ sendStyle }}"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7L8 3.5 11.5 7"></path></svg></div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:360},&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;project&quot;,&quot;projectSwitched&quot;,&quot;workspace&quot;,&quot;workspaceNoGit&quot;,&quot;worktreeChip&quot;,&quot;effortClaude&quot;,&quot;effortCodex&quot;,&quot;modeCursor&quot;,&quot;permClaude&quot;,&quot;permCodex&quot;,&quot;attach&quot;,&quot;cursorImage&quot;,&quot;mention&quot;,&quot;slash&quot;,&quot;plainCodex&quot;,&quot;plainClaude&quot;,&quot;plainCursor&quot;,&quot;hoverCodex&quot;,&quot;hoverClaude&quot;,&quot;hoverCursor&quot;,&quot;hmOpen&quot;,&quot;hmFilter&quot;,&quot;hmMissing&quot;,&quot;hmFallback&quot;,&quot;hmLong&quot;],&quot;default&quot;:&quot;project&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:360,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const V = {
      light:{'--bg':'#FFFFFF','--field':'#FFFFFF','--popover':'#FFFFFF','--sep':'rgba(0,0,0,0.10)','--fg':'#1D1D1F','--fg2':'#5B5B60','--fg3':'#75757B','--hover':'rgba(0,0,0,0.05)','--sel':'rgba(0,0,0,0.075)','--selStrong':'rgba(59,70,155,0.14)','--accent':'#3B469B','--accentInk':'#3B469B','--accentFill':'#3B469B','--ctl':'#FFFFFF','--ctlBorder':'rgba(0,0,0,0.16)','--fieldBorder':'rgba(0,0,0,0.14)','--off':'rgba(0,0,0,0.08)','--shadow':'0 10px 30px rgba(0,0,0,0.16), 0 0 0 0.5px rgba(0,0,0,0.2)'},
      dark:{'--bg':'#1E1E20','--field':'#1A1A1C','--popover':'#2F2F33','--sep':'rgba(255,255,255,0.10)','--fg':'#F2F2F4','--fg2':'#ABABB1','--fg3':'#8E8E94','--hover':'rgba(255,255,255,0.06)','--sel':'rgba(255,255,255,0.09)','--selStrong':'rgba(149,156,208,0.22)','--accent':'#959CD0','--accentInk':'#959CD0','--accentFill':'#3B469B','--ctl':'#3A3A3E','--ctlBorder':'rgba(255,255,255,0.10)','--fieldBorder':'rgba(255,255,255,0.14)','--off':'rgba(255,255,255,0.08)','--shadow':'0 12px 34px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.16)'}
    };
    const I = {
      gauge:'M2.5 11a5.5 5.5 0 0111 0M8 11l2.6-3.2',
      mode:'M3 4.5h10M3 8h10M3 11.5h6',
      tray:'M2 9h3.5l1 1.5h3l1-1.5H14M3.5 3.5h9L14 9v3.5a.5.5 0 01-.5.5h-11a.5.5 0 01-.5-.5V9z',
      branch:'M3.5 3.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M3.5 12.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M9.5 5.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M5 5v6M11 7c0 2.5-6 2-6 4',
      doc:'M4 2.5h5l3 3v8H4zM9 2.5v3h3',
      photo:'M2.5 3.5h11v9h-11zM2.5 10.5l3-3 3 3 2-2 3 3M10 6.2v.1'
    };
    const S = {
      project:{ overlay:'project', text:'draftA' },
      projectSwitched:{ project:'ios-companion', text:'draftB', focus:true },
      workspace:{ overlay:'workspace', text:'draftA' },
      workspaceNoGit:{ overlay:'workspace', project:'site', nogit:true },
      worktreeChip:{ workspace:'worktree', text:'draftA', focus:true },
      effortClaude:{ harness:'claude', overlay:'effort' },
      effortCodex:{ overlay:'effort' },
      modeCursor:{ harness:'cursor', overlay:'effort' },
      permClaude:{ harness:'claude', overlay:'perm' },
      permCodex:{ overlay:'perm' },
      attach:{ overlay:'attach' },
      cursorImage:{ harness:'cursor', image:true, text:'draftImg', reason:'Cursor は画像を送れません。画像を外すか、画像を送れるハーネスを選んでください', focus:true },
      mention:{ overlay:'mention', text:'mention', focus:true },
      slash:{ harness:'claude', overlay:'slash', text:'slash', focus:true },
      plainCodex:{ text:'draftA' },
      plainClaude:{ harness:'claude', text:'draftA' },
      plainCursor:{ harness:'cursor', text:'draftA' },
      hoverCodex:{ text:'draftA', hover:true },
      hoverClaude:{ harness:'claude', text:'draftA', hover:true },
      hoverCursor:{ harness:'cursor', text:'draftA', hover:true },
      hmOpen:{ overlay:'harness', hm:'open' },
      hmFilter:{ overlay:'harness', hm:'filter' },
      hmMissing:{ overlay:'harness', hm:'missing' },
      hmFallback:{ overlay:'harness', hm:'fallback' },
      hmLong:{ overlay:'harness', hm:'long' }
    };
    const c = S[p.scenario] || S.project;
    const harness = c.harness || 'codex';
    const H = {
      codex:{ name:'Codex:', model:'gpt-6.1-sol', effort:'高', perm:'Full Access', effortIcon:I.gauge },
      claude:{ name:'Claude Code:', model:'Fable 5.1', effort:'高', perm:'acceptEdits', effortIcon:I.gauge },
      cursor:{ name:'Cursor:', model:'Composer 2.5', effort:'既定', perm:null, effortIcon:I.mode }
    }[harness];
    const T = {
      draftA:['README の英語版を、今の仕様に合わせて更新してください。',''],
      draftB:['TestFlight 用のビルド番号を、CI で自動的に上げるようにしてください。',''],
      draftImg:['添付のスクリーンショットの崩れを直してください。',''],
      mention:['次のファイルの重複した処理をまとめてください: ','@Dash'],
      slash:['','/']
    };
    const t = c.text ? T[c.text] : null;
    const lvl = (names, cur, hl) => names.map(n => ({ label:n, checked:n === cur, hl:n === hl }));
    let menu = { items:[], width:240, header:'', footer:'' };
    const o = c.overlay;
    if (o === 'project') menu = { width:320, header:'', footer:'本文と添付はプロジェクトごとに保たれます', items:[
      { label:'Phlox-oss', desc:'~/Projects/Phlox-oss', path:true, checked:true },
      { label:'ios-companion', desc:'~/Projects/ios-companion', path:true, tag:'下書きあり', hl:true },
      { label:'site', desc:'~/Sites/site', path:true },
      { sep:true },
      { label:'プロジェクトを追加…', right:'⌘O' } ] };
    if (o === 'workspace') menu = { width:340, header:'', footer:'', items:[
      { icon:I.tray, label:'既存ディレクトリ', desc:'このフォルダで直接作業する', checked:true },
      c.nogit
        ? { icon:I.branch, label:'新しい worktree', desc:'別の作業コピーを作って分けて作業する', disabled:true, reason:'git リポジトリではないため worktree を作れません' }
        : { icon:I.branch, label:'新しい worktree', desc:'別の作業コピーを作って分けて作業する', hl:true } ] };
    if (o === 'effort' && harness === 'claude') menu = { width:180, header:'effort', footer:'', items:lvl(['低','中','高','非常に高','最大'],'高','非常に高') };
    if (o === 'effort' && harness === 'codex') menu = { width:180, header:'effort', footer:'', items:lvl(['低','中','高','非常に高','最大','ultra'],'高','非常に高') };
    if (o === 'effort' && harness === 'cursor') menu = { width:180, header:'mode', footer:'', items:lvl(['既定','ask','plan'],'既定','ask') };
    if (o === 'perm' && harness === 'claude') menu = { width:220, header:'権限', footer:'', items:lvl(['acceptEdits','auto','bypassPermissions','manual','dontAsk','plan'],'acceptEdits','auto') };
    if (o === 'perm' && harness === 'codex') menu = { width:200, header:'権限', footer:'', items:lvl(['Full Access','Default','Read Only'],'Full Access','Default') };
    if (o === 'attach') menu = { width:200, header:'', footer:'', items:[ { icon:I.doc, label:'ファイルを添付…', hl:true }, { icon:I.photo, label:'画像を添付…' } ] };
    if (o === 'mention') menu = { width:760, header:'ファイル · Phlox-oss（既存ディレクトリ）', footer:'↑↓ 移動 · ↩ 挿入 · Esc 閉じる', items:[
      { icon:I.doc, mono:true, label:'DashboardView.swift', desc:'macos/Packages/DashboardFeature/Sources/DashboardFeature/Dashboard/', path:true, hl:true },
      { icon:I.doc, mono:true, label:'DashboardViewModel.swift', desc:'macos/Packages/DashboardFeature/Sources/DashboardFeature/Dashboard/', path:true },
      { icon:I.doc, mono:true, label:'DashboardSidebarView.swift', desc:'macos/Packages/DashboardFeature/Sources/DashboardFeature/Dashboard/', path:true },
      { icon:I.doc, mono:true, label:'DashboardDetailView.swift', desc:'macos/Packages/DashboardFeature/Sources/DashboardFeature/Dashboard/', path:true },
      { icon:I.doc, mono:true, label:'DashboardToolbar.swift', desc:'macos/Packages/DashboardFeature/Sources/DashboardFeature/Dashboard/', path:true } ] };
    if (o === 'slash') menu = { width:760, header:'コマンド', footer:'↑↓ 移動 · ↩ 挿入 · Esc 閉じる', items:[
      { mono:true, inline:true, label:'/init', desc:'CLAUDE.md を作る', right:'組込', hl:true },
      { mono:true, inline:true, label:'/review', desc:'プルリクエストをレビューする', right:'組込' },
      { mono:true, inline:true, label:'/security-review', desc:'未コミットの変更のセキュリティ上の問題を調べる', right:'組込' },
      { mono:true, inline:true, label:'/release-notes', desc:'リリースノートの下書きを書く', right:'.claude/commands' },
      { mono:true, inline:true, label:'/changelog', desc:'CHANGELOG を更新する', right:'.claude/skills' } ] };
    const above = o === 'mention' || o === 'slash';
    const base = { height:28, padding:'0 7px', borderRadius:6, display:'flex', alignItems:'center', gap:5, fontSize:12, color:'var(--fg2)', whiteSpace:'nowrap' };
    const st = (k) => o === k ? { ...base, background:'var(--sel)', color:'var(--fg)' } : base;
    const theme = p.theme === 'light' ? 'light' : 'dark';
    const hasText = !!t;
    const canSend = hasText && !c.reason;
    const Ht = Number(p.height) || 360;
    return {
      rootStyle: { ...V[theme], width:820, height:Ht, boxSizing:'border-box', padding: above ? '0 30px 28px' : '28px 30px 0', display:'flex', flexDirection:'column', justifyContent: above ? 'flex-end' : 'flex-start', background:'var(--bg)', color:'var(--fg)', borderRadius:10, overflow:'hidden', fontFamily:"-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif", fontSize:13, boxShadow: theme === 'dark' ? '0 0 0 0.5px rgba(0,0,0,0.7)' : '0 0 0 0.5px rgba(0,0,0,0.22)' },
      composerStyle: { width:'100%', boxSizing:'border-box', background:'var(--field)', borderRadius:12, padding:'12px 10px 8px 14px', boxShadow: c.focus ? 'inset 0 0 0 1px var(--accent), 0 0 0 1px var(--accent)' : 'inset 0 0 0 1px var(--fieldBorder)' },
      chip: { attach:{ width:28, height:28, borderRadius:6, display:'flex', alignItems:'center', justifyContent:'center', color: o === 'attach' ? 'var(--fg)' : 'var(--fg2)', background: o === 'attach' ? 'var(--sel)' : 'transparent' }, harness: { ...st('harness'), flex:'none', ...(c.hover ? { background:'var(--hover)' } : {}) }, effort: st('effort'), perm: st('perm'), project: st('project'), workspace: st('workspace') },
      hmVariant: c.hm || 'open',
      harnessKey: harness, harnessTitle: H.name + ' ' + H.model, tooltip: !!c.hover,
      open: { harness: o === 'harness', attach: o === 'attach', effort: o === 'effort', perm: o === 'perm', project: o === 'project', workspace: o === 'workspace' },
      menuAbove: above, menu,
      harnessName: H.name, modelName: H.model, effortLabel: H.effort, effortIcon: H.effortIcon, permLabel: H.perm, hasPerm: !!H.perm,
      projectLabel: c.project || 'Phlox-oss',
      workspaceLabel: c.workspace === 'worktree' ? '新しい worktree' : '既存ディレクトリ',
      workspaceIcon: c.workspace === 'worktree' ? I.branch : I.tray,
      image: !!c.image, hasText, empty: !hasText, textMain: t ? t[0] : '', token: t ? t[1] : '', hasToken: !!(t && t[1]), caret: !!c.focus,
      reason: c.reason || '', hasReason: !!c.reason,
      sendStyle: { width:28, height:28, borderRadius:14, flex:'none', display:'flex', alignItems:'center', justifyContent:'center', background: canSend ? 'var(--accentFill)' : 'var(--off)', color: canSend ? '#FFFFFF' : 'var(--fg3)' }
    };
  }
}
</script>
</body>
</html>
