<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="{{ rootStyle }}">
  <div style="width:760px;display:flex;flex-direction:column;align-items:center;">
    <div style="width:100%;box-sizing:border-box;background:var(--field);border-radius:12px;padding:12px 10px 8px 14px;box-shadow:inset 0 0 0 1px var(--fieldBorder);">
      <div style="min-height:40px;font-size:13px;line-height:20px;color:var(--fg3);">やりたいことを入力（/ でコマンド）</div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--fg2);">
        <div style="flex:1;min-width:0;display:flex;align-items:center;gap:2px;">
          <div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M8 3v10M3 8h10"></path></svg></div>
          <div title="{{ harnessTitle }}" style="height:28px;padding:0 7px;display:flex;align-items:center;gap:5px;white-space:nowrap;color:var(--fg);"><span style="display:flex;"><dc-import name="HarnessLogo" harness="{{ harness }}" size="14" hint-size="14px,14px"></dc-import></span>{{ model }}<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg></div>
          <div style="height:28px;padding:0 7px;display:flex;align-items:center;gap:5px;white-space:nowrap;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.4" stroke-linecap="round"><path d="{{ effortIcon }}"></path></svg>{{ effort }}<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg></div>
          <sc-if value="{{ hasPerm }}" hint-placeholder-val="{{ true }}"><div style="height:28px;padding:0 7px;display:flex;align-items:center;gap:5px;white-space:nowrap;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linejoin="round"><path d="M8 2l5 2v4c0 3-2.2 5.2-5 6-2.8-.8-5-3-5-6V4z"></path></svg>Full Access<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg></div></sc-if>
        </div>
        <div style="flex:none;display:flex;align-items:center;gap:2px;">
          <div style="height:28px;padding:0 7px;display:flex;align-items:center;gap:5px;white-space:nowrap;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linejoin="round"><path d="M2 4.5A1 1 0 013 3.5h3l1.5 1.5H13a1 1 0 011 1V12a1 1 0 01-1 1H3a1 1 0 01-1-1z"></path></svg>Phlox-oss<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg></div>
          <div style="height:28px;padding:0 7px;display:flex;align-items:center;gap:5px;white-space:nowrap;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="var(--fg3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ workspaceIcon }}"></path></svg>{{ workspaceLabel }}<svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="var(--fg3)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 4.75L6 7.25l2.5-2.5"></path></svg></div>
          <div style="width:6px;"></div>
          <div style="width:28px;height:28px;border-radius:14px;background:var(--off);display:flex;align-items:center;justify-content:center;color:var(--fg3);"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12.5v-9M4.5 7L8 3.5 11.5 7"></path></svg></div>
        </div>
      </div>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px;">
      <div style="height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ctlBorder);display:flex;align-items:center;font-size:12px;color:var(--fg2);">コードレビュー</div>
      <div style="height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ctlBorder);display:flex;align-items:center;font-size:12px;color:var(--fg2);">バグ修正</div>
      <div style="height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ctlBorder);display:flex;align-items:center;font-size:12px;color:var(--fg2);">テスト追加</div>
      <div style="height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ctlBorder);display:flex;align-items:center;font-size:12px;color:var(--fg2);">コードの説明</div>
      <div style="height:28px;padding:0 10px;border-radius:6px;box-shadow:inset 0 0 0 1px var(--ctlBorder);display:flex;align-items:center;font-size:12px;color:var(--fg2);">リファクタ</div>
    </div>
    <div style="position:relative;height:24px;margin-top:12px;display:flex;align-items:center;justify-content:center;width:100%;">
      <sc-if value="{{ showButton }}" hint-placeholder-val="{{ true }}">
        <div style="{{ buttonStyle }}">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M2.5 8a5.5 5.5 0 1011 0a5.5 5.5 0 10-11 0M8 5v3l2 1.5"></path></svg>履歴から再開…
        </div>
      </sc-if>
      <sc-if value="{{ hidden }}" hint-placeholder-val="{{ false }}">
        <div style="width:120px;height:24px;box-sizing:border-box;border:1px dashed rgba(168,118,235,0.7);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:#C4A2F4;">高さ 24pt を保つ</div>
      </sc-if>
      <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
        <div style="position:absolute;top:30px;left:50%;transform:translateX(-50%);z-index:5;width:480px;box-sizing:border-box;background:var(--popover);border-radius:10px;box-shadow:var(--shadow);padding:5px;display:flex;flex-direction:column;">
          <div style="display:flex;align-items:center;gap:8px;padding:5px 8px 4px;">
            <span style="flex:1;font-size:11px;font-weight:600;color:var(--fg2);">{{ header }}</span>
            <sc-if value="{{ hasCount }}" hint-placeholder-val="{{ false }}"><span style="font-size:11px;color:var(--fg2);">20 件</span></sc-if>
          </div>
          <div style="display:flex;align-items:center;gap:6px;margin:0 2px 4px;padding:6px 8px;border-radius:6px;background:var(--sel);font-size:11px;line-height:1.4;color:var(--fg);">
            <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="var(--fg2)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="{{ hintIcon }}"></path></svg>{{ hint }}
          </div>
          <sc-if value="{{ isList }}" hint-placeholder-val="{{ true }}">
            <div style="position:relative;height:300px;overflow:hidden;">
              <sc-for list="{{ rows }}" as="r" hint-placeholder-count="6">
                <div style="{{ r.style }}">
                  <div style="font-size:13px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ r.title }}</div>
                  <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--fg2);">
                    <span>{{ r.time }}</span><span style="color:var(--fg3);">·</span><span>{{ r.where }}</span>
                  </div>
                  <sc-if value="{{ r.note }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;line-height:1.5;color:var(--fg);margin-top:1px;">{{ noteText }}</div></sc-if>
                </div>
              </sc-for>
              <div style="position:absolute;right:1px;top:0;width:5px;height:96px;border-radius:3px;background:var(--fg3);opacity:0.55;"></div>
            </div>
          </sc-if>
          <sc-if value="{{ isLoading }}" hint-placeholder-val="{{ false }}">
            <div style="display:flex;flex-direction:column;gap:2px;padding:2px 2px 4px;">
              <div style="padding:8px;display:flex;flex-direction:column;gap:6px;"><div style="height:10px;width:70%;border-radius:3px;background:var(--sel);"></div><div style="height:8px;width:30%;border-radius:3px;background:var(--sel);"></div></div>
              <div style="padding:8px;display:flex;flex-direction:column;gap:6px;"><div style="height:10px;width:56%;border-radius:3px;background:var(--sel);"></div><div style="height:8px;width:26%;border-radius:3px;background:var(--sel);"></div></div>
              <div style="padding:8px;display:flex;flex-direction:column;gap:6px;"><div style="height:10px;width:64%;border-radius:3px;background:var(--sel);"></div><div style="height:8px;width:34%;border-radius:3px;background:var(--sel);"></div></div>
              <div style="padding:2px 8px 4px;font-size:11px;color:var(--fg2);">読み込んでいます…</div>
            </div>
          </sc-if>
          <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
            <div style="padding:20px 8px 22px;text-align:center;font-size:12px;color:var(--fg2);">履歴がありません</div>
          </sc-if>
          <sc-if value="{{ isError }}" hint-placeholder-val="{{ false }}">
            <div style="padding:18px 8px 18px;display:flex;flex-direction:column;align-items:center;gap:8px;">
              <div style="font-size:12px;color:var(--fg);">履歴を読み込めませんでした</div>
              <div style="height:26px;padding:0 12px;border-radius:6px;background:var(--ctl);box-shadow:0 0 0 0.5px var(--ctlBorder);font-size:12px;color:var(--fg);display:flex;align-items:center;">再試行</div>
            </div>
          </sc-if>
          <div style="border-top:1px solid var(--sep);margin:4px 2px 0;padding:6px 6px 2px;font-size:11px;color:var(--fg2);">{{ footer }}</div>
        </div>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:820,&quot;height&quot;:560},&quot;scenario&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;list&quot;,&quot;listWorktree&quot;,&quot;loading&quot;,&quot;empty&quot;,&quot;error&quot;,&quot;hover&quot;,&quot;none&quot;,&quot;cursor&quot;],&quot;default&quot;:&quot;list&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dark&quot;,&quot;light&quot;],&quot;default&quot;:&quot;dark&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:560,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const V = {
      light:{'--bg':'#FFFFFF','--field':'#FFFFFF','--popover':'#FFFFFF','--sep':'rgba(0,0,0,0.10)','--fg':'#1D1D1F','--fg2':'#5B5B60','--fg3':'#75757B','--hover':'rgba(0,0,0,0.05)','--sel':'rgba(0,0,0,0.075)','--selStrong':'rgba(59,70,155,0.14)','--accentInk':'#3B469B','--ctl':'#FFFFFF','--ctlBorder':'rgba(0,0,0,0.16)','--fieldBorder':'rgba(0,0,0,0.14)','--off':'rgba(0,0,0,0.08)','--shadow':'0 10px 30px rgba(0,0,0,0.16), 0 0 0 0.5px rgba(0,0,0,0.2)'},
      dark:{'--bg':'#1E1E20','--field':'#1A1A1C','--popover':'#2F2F33','--sep':'rgba(255,255,255,0.10)','--fg':'#F2F2F4','--fg2':'#ABABB1','--fg3':'#8E8E94','--hover':'rgba(255,255,255,0.06)','--sel':'rgba(255,255,255,0.09)','--selStrong':'rgba(149,156,208,0.22)','--accentInk':'#959CD0','--ctl':'#3A3A3E','--ctlBorder':'rgba(255,255,255,0.10)','--fieldBorder':'rgba(255,255,255,0.14)','--off':'rgba(255,255,255,0.08)','--shadow':'0 12px 34px rgba(0,0,0,0.55), 0 0 0 0.5px rgba(255,255,255,0.16)'}
    };
    const theme = p.theme === 'light' ? 'light' : 'dark';
    const s = p.scenario || 'list';
    const cursor = s === 'cursor';
    const wtSel = s === 'listWorktree';
    const tray = 'M2 9h3.5l1 1.5h3l1-1.5H14M3.5 3.5h9L14 9v3.5a.5.5 0 01-.5.5h-11a.5.5 0 01-.5-.5V9z';
    const branch = 'M3.5 3.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M3.5 12.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M9.5 5.5a1.5 1.5 0 103 0a1.5 1.5 0 10-3 0M5 5v6M11 7c0 2.5-6 2-6 4';
    const data = [
      ['PaneTree の正規化で、子が 1 つだけのときに分割を畳む処理を追加','3 時間前','Phlox-oss'],
      ['サイドバーのセッション行に状態の文字を出す','昨日','worktree'],
      ['Localizable.xcstrings の未使用キーを洗い出して削除','2 日前','worktree（削除済み）'],
      ['CI の macOS ランナーを上げて、キャッシュの設定を見直す','4 日前','Phlox-oss'],
      ['承認カードの 0.5 秒の待ちをテストで確かめる','6 日前','Phlox-oss'],
      ['DesignSnapshotRenderTests の見本画像を更新','1 週間前','worktree']
    ];
    const hlIdx = 1;
    const rows = data.map(([title, time, where], i) => {
      const hl = i === hlIdx && !wtSel;
      return { title, time, where, note: hl, style: { padding: '6px 8px', borderRadius:6, display:'flex', flexDirection:'column', gap:2, background: hl || (wtSel && i === 0) ? 'var(--selStrong)' : 'transparent' } };
    });
    const open = ['list','listWorktree','loading','empty','error'].includes(s);
    return {
      rootStyle: { ...V[theme], width:820, height:Number(p.height) || 560, boxSizing:'border-box', padding:'28px 30px 0', background:'var(--bg)', color:'var(--fg)', borderRadius:10, overflow:'hidden', fontFamily:"-apple-system,BlinkMacSystemFont,'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif", fontSize:13, boxShadow: theme === 'dark' ? '0 0 0 0.5px rgba(0,0,0,0.7)' : '0 0 0 0.5px rgba(0,0,0,0.22)' },
      harness: cursor ? 'cursor' : 'codex', model: cursor ? 'Composer 2.5' : 'gpt-6.1-sol', harnessTitle: cursor ? 'Cursor: Composer 2.5' : 'Codex: gpt-6.1-sol',
      effort: cursor ? '既定' : '高', effortIcon: cursor ? 'M3 4.5h10M3 8h10M3 11.5h6' : 'M2.5 11a5.5 5.5 0 0111 0M8 11l2.6-3.2', workspaceIcon: wtSel ? branch : tray, hasPerm: !cursor, workspaceLabel: wtSel ? '新しい worktree' : '既存ディレクトリ',
      showButton: !cursor && s !== 'none', hidden: cursor || s === 'none', open,
      buttonStyle: { height:24, padding:'0 8px', borderRadius:6, display:'flex', alignItems:'center', gap:5, fontSize:12, color: open || s === 'hover' ? 'var(--fg)' : 'var(--fg2)', background: open ? 'var(--sel)' : s === 'hover' ? 'var(--hover)' : 'transparent' },
      header: 'Codex の履歴 · Phlox-oss', hasCount: s === 'list' || s === 'listWorktree',
      hint: wtSel ? '選んだ会話を、新しい worktree を作って再開します' : '選んだ会話を、今の作業場所（既存ディレクトリ）で再開します',
      hintIcon: wtSel ? branch : tray,
      noteText: '元の worktree には戻らず、既存ディレクトリで再開します',
      isList: s === 'list' || s === 'listWorktree', isLoading: s === 'loading', isEmpty: s === 'empty', isError: s === 'error',
      rows,
      footer: s === 'list' || s === 'listWorktree' ? '↑↓ 移動 · ↩ 再開 · Esc 閉じる' : 'Esc 閉じる'
    };
  }
}
</script>
</body>
</html>
