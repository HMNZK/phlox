<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>作業中のカード</title>
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="pc" style="width: 720px; height: 720px; padding: 32px 40px 28px; display: flex; flex-direction: column; gap: 14px">
<div class="log" style="width: 100%">
<div class="um">429 が返ったら指数バックオフ＋ジッターで最大 5 回まで再試行するようにして。Retry-After があればそれを優先して</div>
<div class="am"><p>了解です。今の再試行の有無を確かめてから、4 つに分けて進めます。</p></div>

<section class="asc" aria-label="実行中。retry_after.go を編集中。経過 1 分 12 秒">
<div class="ash">
<span class="dots" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><b></b></span>
<span class="now"><span class="ic" aria-hidden="true" style="color: var(--ic)"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10.6 2.6l2.8 2.8-7.6 7.6H3v-2.8z"></path></svg></span><span class="tx">retry_after.go を編集中</span></span>
<span class="el">1:12</span>
</div>
<div class="asb">
<div class="tl">

<div class="ti">
<button class="tr done" aria-expanded="false" aria-label="完了。backoff の純関数を追加。31 秒"><span class="chev"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5L6.5 5 3 8.5"></path></svg></span><span class="mk"><span class="mdone"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 5.2l2.2 2.2L8.5 2.6"></path></svg></span></span><span class="tn">backoff の純関数を追加</span><span class="du">0:31</span></button>
</div>

<div class="ti">
<button class="tr" aria-expanded="true" aria-label="進行中。Retry-After を秒数と日付の両方で読む。24 秒"><span class="chev open"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5L6.5 5 3 8.5"></path></svg></span><span class="mk"><span class="mrun" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span></span><span class="tn">Retry-After を秒数と日付の両方で読む</span><span class="du">0:24</span></button>
<div class="wl">
<button class="wr"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="7" cy="7" r="4.2"></circle><path d="M10.2 10.2l3.6 3.6"></path></svg></span><span class="wx">「Retry-After」を検索 · 4 件</span><span class="du">0.4s</span></button>
<button class="wr"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M4 1.8h5.2L12 4.6v9.6H4z"></path><path d="M9 1.8v3h3"></path></svg></span><span class="wx"><span class="f">client.go</span> ほか 1 ファイルを読み込み</span><span class="du">0.9s</span></button>
<div class="wt">日付の形式で返るサーバーもあるので、<code>http.ParseTime</code> で両方受けます。上限は 30 秒にします。</div>
<button class="wr run"><span class="ic"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"><path d="M10.6 2.6l2.8 2.8-7.6 7.6H3v-2.8z"></path></svg></span><span class="wx"><span class="f">retry_after.go</span> を編集中</span><span class="du"></span></button>
</div>
</div>

<div class="ti">
<button class="tr todo" disabled aria-label="未着手。Do を包んで 429 と 503 を再試行"><span class="chev none"></span><span class="mk"><span class="mtodo"></span></span><span class="tn">Do を包んで 429 と 503 を再試行</span><span class="du"></span></button>
</div>

<div class="ti">
<button class="tr todo" disabled aria-label="未着手。テストを追加して通す"><span class="chev none"></span><span class="mk"><span class="mtodo"></span></span><span class="tn">テストを追加して通す</span><span class="du"></span></button>
</div>

</div>
</div>
</section>
</div>
<div style="flex: 1"></div>
<div class="cmp">入力欄（現行のまま）</div>
</div>
</body>
</html>
