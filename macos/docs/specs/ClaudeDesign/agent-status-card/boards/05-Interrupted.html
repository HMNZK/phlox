<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中断したカード</title>
<link rel="stylesheet" href="card.css">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</head>
<body>
<div class="pc" style="width: 720px; height: 520px; padding: 32px 40px 28px; display: flex; flex-direction: column; gap: 14px">
<div class="log" style="width: 100%">
<div class="um">auth.spec.ts のフレークを直して。ログイン後のリダイレクトで落ちることがある</div>

<section class="asc" aria-label="中断。所要 42 秒。タスク 3 件中 1 件完了">
<div class="ash">
<span class="lead" aria-hidden="true"><span class="mstop" style="width: 15px; height: 15px"><i></i></span></span>
<span class="now"><span class="tx">中断</span></span>
<span class="el">0:42</span>
</div>
<div class="asb">
<div class="tl">
<div class="ti">
<button class="tr done" aria-expanded="false" aria-label="完了。失敗するテストを 20 回まわして特定。18 秒"><span class="chev"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5L6.5 5 3 8.5"></path></svg></span><span class="mk"><span class="mdone"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M1.5 5.2l2.2 2.2L8.5 2.6"></path></svg></span></span><span class="tn">失敗するテストを 20 回まわして特定</span><span class="du">0:18</span></button>
</div>
<div class="ti">
<button class="tr" aria-expanded="false" aria-label="中断。storageState の書き込みを待つ。24 秒"><span class="chev"><svg viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M3 1.5L6.5 5 3 8.5"></path></svg></span><span class="mk"><span class="mstop"><i></i></span></span><span class="tn">storageState の書き込みを待つ</span><span class="du">0:24</span></button>
</div>
<div class="ti">
<button class="tr todo" disabled aria-label="未着手。CI で 3 回連続で通す"><span class="chev none"></span><span class="mk"><span class="mtodo"></span></span><span class="tn">CI で 3 回連続で通す</span><span class="du"></span></button>
</div>
</div>
</div>
</section>
</div>
<div style="flex: 1"></div>
<div class="cmp">入力欄（現行のまま）</div>
</div>
</body>
</html>
